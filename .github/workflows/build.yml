# Compila los dos firmware y, en main, deja los binarios en la rama `builds`,
# que es de donde los baja Oryx Signal Studio para cargarlos en el ESP32 desde
# el navegador. La rama se rehace entera en cada publicación: solo guarda la
# última compilación.
#
# Seguridad:
# - En un pull request (también desde un fork) solo se compila: el job no
#   tiene permiso de escritura ni secretos, y nunca se publica nada. Por eso
#   se usa `pull_request` y jamás `pull_request_target`.
# - Publicar es un job aparte, el único con `contents: write`, y corre solo
#   después de un push a main, es decir, con código ya revisado y aceptado.
# - Las actions van fijadas por SHA (lo exige la configuración del
#   repositorio). Dependabot propone las actualizaciones.
#
# Los archivos se escriben en las mismas direcciones que usa el Arduino IDE
# (ver manifest.json), así la zona de ajustes (NVS) no se toca y el equipo
# conserva la red WiFi guardada.

name: Compilar firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nada por defecto: cada job pide solo lo que usa
permissions: {}

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE: esp32:esp32@3.3.0
  FQBN: esp32:esp32:esp32
  INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Core ESP32 y librerías
        run: |
          arduino-cli core update-index --additional-urls "$INDEX_URL"
          arduino-cli core install "$CORE" --additional-urls "$INDEX_URL"
          # Las del firmware SD; el de USB/WiFi no usa librerías externas
          arduino-cli lib install U8g2 ESP32Encoder Button2

      - name: Compilar
        run: |
          set -euo pipefail
          mkdir -p out
          for nombre in oryx_signal_esp32 oryx_signal_sd; do
            # El .ino puede estar en su propia carpeta o en la raíz
            if [ -f "$nombre/$nombre.ino" ]; then fuente="$nombre/$nombre.ino"; else fuente="$nombre.ino"; fi
            # arduino-cli exige que la carpeta se llame como el sketch
            mkdir -p "sketch/$nombre"
            cp "$fuente" "sketch/$nombre/$nombre.ino"
            arduino-cli compile --fqbn "$FQBN" --build-path "build/$nombre" "sketch/$nombre"
            cp "build/$nombre/$nombre.ino.bootloader.bin" "out/$nombre.bootloader.bin"
            cp "build/$nombre/$nombre.ino.partitions.bin" "out/$nombre.partitions.bin"
            cp "build/$nombre/$nombre.ino.bin"            "out/$nombre.app.bin"
            echo "$nombre=$fuente" >> fuentes.txt
          done
          cp "$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -n 1)" out/boot_app0.bin

      - name: Manifiesto
        run: |
          python3 - <<'PY'
          import datetime, json, os
          fuentes = dict(l.strip().split('=', 1) for l in open('fuentes.txt'))
          def firmware(nombre):
              return {
                  'source': fuentes[nombre],
                  'chip': 'ESP32',
                  'parts': [
                      {'file': f'{nombre}.bootloader.bin', 'address': 0x1000},
                      {'file': f'{nombre}.partitions.bin', 'address': 0x8000},
                      {'file': 'boot_app0.bin',            'address': 0xe000},
                      {'file': f'{nombre}.app.bin',        'address': 0x10000},
                  ],
              }
          manifest = {
              'commit': os.environ['GITHUB_SHA'],
              'date': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'core': os.environ['CORE'],
              'firmwares': {
                  'esp32': firmware('oryx_signal_esp32'),
                  'sd': firmware('oryx_signal_sd'),
              },
          }
          json.dump(manifest, open('out/manifest.json', 'w'), indent=2)
          PY
          cat out/manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: out/
          retention-days: 7

  publicar:
    name: Publicar en builds
    needs: compilar
    # Solo código que ya está en main; nunca desde un pull request
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware
          path: out

      - name: Publicar en la rama builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Binarios de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
